services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: praxis_local
      POSTGRES_USER: praxis_local
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis_local -d praxis_local"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
